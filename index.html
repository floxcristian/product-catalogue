<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo Implementos · Miguel Ángel Cruz Crispin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- marca + cotización -->
  <div class="brand-tab"><span class="logo-mark"><img class="logo-img" src="https://admin.implementos.cl/assets/img/logo-implementos.png" alt="Implementos" style="height:46px"><span class="logo-text" style="display:none;font-size:28px"><b>implementos</b><span class="ep">EPYSA</span></span></span></div>
  <button class="quote-btn" id="quoteBtn">
    <span data-icon="cart" style="display:flex"></span> Carro de compras
    <span class="count" id="quoteCount">0</span>
  </button>

  <!-- flechas -->
  <button class="nav-arrow prev" id="prevBtn" aria-label="Anterior" data-icon="left"></button>
  <button class="nav-arrow next" id="nextBtn" aria-label="Siguiente" data-icon="right"></button>

  <!-- stage -->
  <div class="stage">
    <div class="book-scale" id="bookScale">
      <div class="book" id="book"></div>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="dots" id="dots"></div>
    <span class="pageno" id="pageno">Portada</span>
  </div>

  <div class="tip" id="tip">← → para hojear · arrastra tus fotos sobre cada producto</div>

  <!-- toast -->
  <div class="toast" id="toast"><span class="chk" data-icon="check"></span><span id="toastMsg">Agregado</span></div>

  <!-- lightbox galería -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" data-lbclose aria-label="Cerrar" data-icon="close"></button>
    <img id="lbImg" alt="Imagen de producto" />
    <div class="lb-hint">Click fuera o Esc para cerrar</div>
  </div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0B4DA2"/>
      <rect y="74" width="100" height="26" fill="#00A878"/>
      <text x="50" y="46" font-family="Arial" font-weight="bold" font-size="30" fill="#fff" text-anchor="middle">I</text>
    </svg>
  </template>

  <script src="image-slot.js"></script>
  <script src="images.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
